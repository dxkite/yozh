services:
  react:
    build:
      context: ../..
      dockerfile: Dockerfile
    command:
      - serve
      - --bundle
      - /data/bundle.mjs
      - --bootstrap-kind
      - react
      - --port
      - "8080"
    ports:
      - "8081:8080"
    volumes:
      - ./bundle.mjs:/data/bundle.mjs:ro
    restart: unless-stopped
