services:
  astro-runtime-qjs:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "18081:8080"
    volumes:
      - ./integration/testdata/example/example.pack:/data/bundle.pack:ro
      - bench-astro-qjs-cache:/cache
    command: ["serve", "--pack", "/data/bundle.pack", "--port", "8080", "--cache-dir", "/cache", "--engine", "qjs"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 15
      start_period: 10s

  astro-runtime-goja:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "18083:8080"
    volumes:
      - ./integration/testdata/example/example.pack:/data/bundle.pack:ro
    command: ["serve", "--pack", "/data/bundle.pack", "--port", "8080", "--engine", "goja"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 15
      start_period: 10s

  node-ssr:
    build:
      context: .
      dockerfile: benchmark/Dockerfile.node
    ports:
      - "18082:3001"
    volumes:
      - ./examples/example:/data:ro
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "const h=require('node:http');h.get('http://localhost:3001/',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 3s
      timeout: 5s
      retries: 15
      start_period: 15s

volumes:
  bench-astro-qjs-cache:
